<style>
:root{--navy:#123d68;--blue:#1d5b91;--gold:#e3b64f;--bg:#f3f6fa;--ink:#172638;--muted:#64748b;--line:#dbe3ec;--white:#fff;--green:#177245;--red:#a93434;--shadow:0 3px 14px #193b5b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}.app-header{background:linear-gradient(120deg,var(--navy),var(--blue));color:#fff;padding:18px max(16px,env(safe-area-inset-left));display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:24px;font-weight:900}.brand h1{font-size:clamp(19px,3vw,27px);line-height:1.15;margin:0}.brand p{margin:4px 0 0;color:#dce9f6;font-size:13px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:700;background:var(--navy);color:#fff;min-height:44px}.btn.secondary{background:#e9eff6;color:var(--navy)}.btn.gold{background:var(--gold);color:#182a3d}.btn.danger{background:#fbe9e9;color:var(--red)}.btn.small{padding:7px 10px;min-height:36px;font-size:14px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1500px;margin:auto;min-height:calc(100vh - 84px)}.sidebar{padding:18px 12px;background:#fff;border-right:1px solid var(--line)}.nav{display:grid;gap:6px;position:sticky;top:10px}.nav button{display:flex;gap:11px;align-items:center;text-align:left;border:0;background:transparent;color:#405168;padding:13px;border-radius:10px;min-height:48px;font-weight:650}.nav button.active,.nav button:hover{background:#eaf1f8;color:var(--navy)}.nav .ico{width:24px;text-align:center;font-size:19px}.main{padding:22px;min-width:0}.page-title{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.page-title h2{margin:0;font-size:clamp(22px,3vw,29px)}.page-title p{margin:5px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px;box-shadow:var(--shadow);min-width:0}.card h3{margin:0 0 12px;font-size:18px}.metric{font-size:30px;font-weight:800;color:var(--navy)}.muted{color:var(--muted)}.smalltext{font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.stack{display:grid;gap:12px}.field{display:grid;gap:5px;min-width:0}.field label{font-weight:700;font-size:14px;color:#34465c}.field input,.field select,.field textarea{width:100%;border:1px solid #cbd5e1;border-radius:9px;padding:11px 12px;background:#fff;color:var(--ink);min-height:44px}.field select[multiple]{min-height:125px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid .full{grid-column:1/-1}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{padding:10px;border:1px solid var(--line);border-radius:9px;min-height:42px;background:#fff}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#fff}.item-main{min-width:0}.item-main strong{display:block;overflow-wrap:anywhere}.item-main p{margin:3px 0 0;color:var(--muted);font-size:13px}.item-actions{display:flex;gap:6px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf3f8;color:var(--navy);font-size:12px;font-weight:700}.empty{text-align:center;padding:30px 16px;border:1px dashed #b9c7d6;border-radius:12px;color:var(--muted);background:#ffffff9c}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{border-collapse:collapse;width:100%;min-width:620px}th,td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}th{background:#edf3f8;color:#31475e;font-size:13px}tr:last-child td{border-bottom:0}.score-input{width:62px;min-height:40px;border:1px solid #cbd5e1;border-radius:8px;text-align:center;padding:6px}.match{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center;padding:13px;background:#fff;border:1px solid var(--line);border-radius:12px}.player-side{min-width:0}.player-side:last-child{text-align:right}.player-side strong{overflow-wrap:anywhere}.vs{font-size:12px;color:var(--muted);font-weight:800}.match-meta{grid-column:1/-1;display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-top:1px solid #edf1f5;padding-top:9px}.match-meta label{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}.match-meta input,.match-meta select{max-width:160px;min-width:90px;padding:7px;border:1px solid var(--line);border-radius:7px}.status{font-size:12px;font-weight:750;border-radius:20px;padding:4px 8px;background:#fff2d4;color:#865a00}.status.done{background:#e4f5eb;color:var(--green)}.bracket{display:flex;gap:14px;overflow:auto;padding:8px 2px 18px;align-items:stretch}.round-col{min-width:220px;max-width:260px;flex:0 0 240px;display:flex;flex-direction:column;gap:12px}.round-col h4{margin:0;color:var(--navy)}.bracket-match{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px;font-size:14px}.bracket-match div{padding:5px 0}.bracket-match div+div{border-top:1px solid #edf1f5}.bracket-match .winner{font-weight:800;color:var(--green)}.notice{padding:12px 14px;background:#fff8e5;border:1px solid #f0d68b;border-radius:10px;color:#70551c;font-size:14px}.footer{padding:20px;text-align:center;color:var(--muted);font-size:12px}.hidden{display:none!important}.mobile-nav{display:none}.backup-note{font-size:13px;color:var(--muted);line-height:1.6}.divider{height:1px;background:var(--line);margin:12px 0}dialog{border:0;border-radius:16px;width:min(620px,calc(100% - 24px));padding:0;box-shadow:0 20px 80px #10243d55;max-height:90vh}dialog::backdrop{background:#0b1c2e88}.modal-head{padding:17px 20px;background:#edf3f8;display:flex;justify-content:space-between;align-items:center}.modal-head h3{margin:0}.modal-body{padding:20px;overflow:auto;max-height:72vh}.modal-foot{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#183c5e;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:20;max-width:90%;text-align:center}.pill-tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:15px}.pill-tabs button{border:1px solid var(--line);border-radius:30px;padding:8px 13px;background:#fff;color:var(--ink)}.pill-tabs button.active{background:var(--navy);color:#fff}.court-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.court{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}.court strong{display:block;color:var(--navy)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.sidebar{display:none}.main{padding:14px 12px 88px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10;justify-content:space-around;gap:2px}.mobile-nav button{border:0;background:transparent;color:#506177;display:grid;justify-items:center;gap:2px;padding:5px 4px;font-size:10px;min-width:0;flex:1}.mobile-nav button.active{color:var(--navy);font-weight:800}.mobile-nav span{font-size:19px}.header-actions .btn{padding:9px 10px;font-size:13px}.app-header{padding:13px}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}.court-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:440px){.grid{grid-template-columns:1fr 1fr;gap:8px}.card{padding:12px}.metric{font-size:25px}.item{align-items:flex-start;flex-direction:column}.item-actions{width:100%}.match{gap:7px;padding:10px}.player-side strong{font-size:13px}.match-meta input,.match-meta select{max-width:125px}.brand p{font-size:12px}.logo{width:40px;height:40px}}

<body>
<header class="app-header"><div class="brand"><div class="logo">CT</div><div><h1>Gestor de Torneos</h1><p>Club Tenis Guardamar · Herramienta gratuita</p></div></div><div class="header-actions"><button class="btn gold" id="quickNew">＋ Nuevo torneo</button><button class="btn secondary" id="headerBackup">⇩ Copia de seguridad</button></div></header>
<div class="layout"><aside class="sidebar"><nav class="nav" id="sideNav"><button data-page="dashboard" class="active"><span class="ico">▦</span>Resumen</button><button data-page="tournaments"><span class="ico">🏆</span>Torneos</button><button data-page="players"><span class="ico">♟</span>Jugadores</button><button data-page="calendar"><span class="ico">▦</span>Jornadas y pistas</button><button data-page="matches"><span class="ico">🎾</span>Partidos y resultados</button><button data-page="standings"><span class="ico">☷</span>Clasificaciones</button><button data-page="backup"><span class="ico">⇅</span>Copias de seguridad</button></nav></aside><main class="main" id="main"></main></div>
<nav class="mobile-nav" id="mobileNav"><button data-page="dashboard" class="active"><span>▦</span>Resumen</button><button data-page="tournaments"><span>🏆</span>Torneos</button><button data-page="players"><span>♟</span>Jugadores</button><button data-page="calendar"><span>📅</span>Jornadas</button><button data-page="matches"><span>🎾</span>Partidos</button><button data-page="standings"><span>☷</span>Tabla</button><button data-page="backup"><span>⇅</span>Copia</button></nav>

<script>
(()=>{'use strict';
const KEY='ct_guardamar_tournament_manager_v1';const $=s=>document.querySelector(s);const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const fmtDate=s=>s?new Date(s+'T12:00:00').toLocaleDateString('es-ES'):'Sin fecha';let page='dashboard',search='',toastTimer;let state=load();let selectedCategory=null;
function fresh(){return {version:1,players:[],tournaments:[],activeTournament:null}}
const INITIAL_BACKUP={"version":1,"players":[{"name":"Alisa Tovchyhrechko/Oleksandra Znova","club":"","phone":"605739408","email":"aliceandreenko@gmail.com","id":"mwum8qwhmcy8kl","availability":""},{"name":"Alexander Solovtsov/Egor Lazarev","club":"","phone":"653729636","email":"alex@topdec.ru","id":"mwumbbqkoic1mj","availability":""},{"name":"Gaidash Ievgenii/Dmytro Moiseienko","club":"","phone":"+380675095813","email":"gov2015@ukr.net","id":"mwumevrstotbzf","availability":""},{"name":"Sofía Bonmati/Olivia Pina","club":"","phone":"685607782","email":"pinagaleote@hotmail.com","id":"mwumho7sjmfp4c","availability":""},{"name":"Volodymyr Husiev/Alexander Bandin","club":"","phone":"+34675179107","email":"gusevvolodumyr12@gmail.com","id":"mwumlpqg2lcksl","availability":""},{"name":"Tymoteusz Lejchter/Héctor Follana","club":"","phone":"624041704","email":"lejchterkarolina@gmail.com","id":"mwumonc81gb9i2","availability":""},{"name":"Dmitry Frolov/Aleksey Dvoretskiy","club":"","phone":"611218585","email":"ssav1318@gmail.com","id":"mwumrhwl6jxtng","availability":""},{"name":"Yelizaveta Pilhalieva/Tetina Stepanenko","club":"","phone":"625552675","email":"elizabeth.pigaleva@gmail.com","id":"mwumxyiiude81y","availability":""},{"name":"Ishan Rico/Silvio Rico","club":"","phone":"663879804","email":"","id":"mwumzqj2m566ec","availability":""}],"tournaments":[{"name":"Torneo de Navidad 2026","startDate":"2026-12-18","endDate":"2026-12-20","location":"Polideportivo Municipal de Guardamar","courts":4,"notes":"","id":"mwum3tvpe711ht","categories":[]}],"activeTournament":"mwum3tvpe711ht","exportedAt":"2026-11-24T12:04:23.057Z"};
function load(){
 try{
  const raw=localStorage.getItem(KEY);
  if(raw){const s=JSON.parse(raw);if(s&&Array.isArray(s.players)&&Array.isArray(s.tournaments))return s;}
 }catch(e){}
 // La copia facilitada se carga únicamente si este navegador todavía no tiene datos.
 const initial=JSON.parse(JSON.stringify(INITIAL_BACKUP));
 initial.tournaments=initial.tournaments.map(t=>({...t,categories:Array.isArray(t.categories)?t.categories:[]}));
 return initial;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){notify('No se pudo guardar. Exporta una copia y libera espacio del navegador.');return false}}
function notify(t){const el=$('#toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3000)}
function activeT(){return state.tournaments.find(t=>t.id===state.activeTournament)||state.tournaments[0]||null}function setActive(id){state.activeTournament=id;save()}
function allMatches(t=activeT()){return t?t.categories.flatMap(c=>c.matches.map(m=>({...m,categoryId:c.id,categoryName:c.name,tournamentId:t.id}))):[]}
function playerName(id){return state.players.find(p=>p.id===id)?.name||'Jugador pendiente'}function categoryById(t,id){return t?.categories.find(c=>c.id===id)}function matchStatus(m){return m.status==='done'||(m.scoreA!==''&&m.scoreB!==''&&m.scoreA!=null&&m.scoreB!=null)}
function nav(p){page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
function pageHead(title,sub,button=''){return `<div class="page-title"><div><h2>${title}</h2><p>${sub||''}</p></div>${button}</div>`}
function empty(msg,button=''){return `<div class="empty"><div style="font-size:30px;margin-bottom:8px">🎾</div><strong>${msg}</strong><p class="smalltext">Los datos se guardan en este dispositivo.</p>${button}</div>`}
function tSelect(){return `<div class="field"><label for="activeTSelect">Torneo activo</label><select id="activeTSelect">${state.tournaments.length?state.tournaments.map(t=>`<option value="${t.id}" ${t.id===activeT()?.id?'selected':''}>${esc(t.name)}</option>`).join(''):'<option value="">Crea un torneo para empezar</option>'}</select></div>`}
function render(){const main=$('#main');switch(page){case'dashboard':main.innerHTML=dashboard();break;case'tournaments':main.innerHTML=tournamentsPage();break;case'players':main.innerHTML=playersPage();break;case'calendar':main.innerHTML=calendarPage();break;case'matches':main.innerHTML=matchesPage();break;case'standings':main.innerHTML=standingsPage();break;case'backup':main.innerHTML=backupPage();break;default:main.innerHTML=dashboard()}bindMain()}
function dashboard(){const t=activeT(),matches=allMatches(t),played=matches.filter(matchStatus).length,players= t?new Set(t.categories.flatMap(c=>c.playerIds)).size:0;return pageHead('Resumen','Panel de control del Club Tenis Guardamar',`<button class="btn" data-action="new-tournament">＋ Crear torneo</button>`)+(t?`<div class="card" style="margin-bottom:14px"><div class="form-grid"><div>${tSelect()}</div><div><label class="field"><span>Periodo</span><strong>${fmtDate(t.startDate)}${t.endDate?' – '+fmtDate(t.endDate):''}</strong></label></div></div><div class="row" style="margin-top:10px"><span class="tag">${esc(t.location||'Sin ubicación')}</span><span class="tag">${t.courts||1} pistas</span><button class="btn secondary small" data-action="edit-tournament" data-id="${t.id}">Editar torneo</button><button class="btn secondary small" data-action="new-category">＋ Categoría</button></div></div>`:empty('Todavía no tienes torneos creados.','<button class="btn" data-action="new-tournament">Crear mi primer torneo</button><p style="margin-top:12px"><button class="btn gold" data-action="load-christmas-demo">🎄 Cargar simulación Navidad</button></p>'))+(t?`<div class="grid"><div class="card"><div class="muted smalltext">Parejas inscritas</div><div class="metric">${players}</div></div><div class="card"><div class="muted smalltext">Partidos programados</div><div class="metric">${matches.length}</div></div><div class="card"><div class="muted smalltext">Partidos terminados</div><div class="metric">${played}</div><div class="smalltext muted">${matches.length?Math.round(played/matches.length*100):0}% completado</div></div></div><div class="grid" style="margin-top:14px"><div class="card"><h3>Accesos rápidos</h3><div class="stack"><button class="btn gold" data-action="load-christmas-demo">🎄 Cargar simulación Navidad</button><button class="btn secondary" data-action="new-player">＋ Añadir jugador</button><button class="btn secondary" data-action="new-category">＋ Crear categoría</button><button class="btn secondary" data-page="matches">Introducir resultados</button><button class="btn secondary" data-page="standings">Ver clasificaciones</button></div></div><div class="card" style="grid-column:span 2"><h3>Próximos partidos</h3>${matches.filter(m=>!matchStatus(m)).sort((a,b)=>(a.date||'9999').localeCompare(b.date||'9999')||(a.time||'').localeCompare(b.time||'')).slice(0,5).map(m=>`<div class="item"><div class="item-main"><strong>${esc(playerName(m.playerA))} — ${esc(playerName(m.playerB))}</strong><p>${esc(m.categoryName)} · ${fmtDate(m.date)} ${esc(m.time||'')} · ${esc(m.court||'Pista sin asignar')}${m.scheduleWarning?' · ⚠ '+esc(m.scheduleWarning):''}</p></div><button class="btn small" data-action="edit-match" data-cat="${m.categoryId}" data-id="${m.id}">Resultado</button></div>`).join('')||'<p class="muted">No hay partidos pendientes.</p>'}</div></div>`:'')+`<p class="footer">CT Guardamar · Los datos se almacenan en este navegador. Haz copias de seguridad periódicas.</p>`}
function tournamentsPage(){return pageHead('Torneos','Crea y administra las competiciones.',`<button class="btn" data-action="new-tournament">＋ Nuevo torneo</button>`)+(state.tournaments.length?`<div class="list">${state.tournaments.map(t=>`<div class="item"><div class="item-main"><strong>${esc(t.name)} ${t.id===activeT()?.id?'<span class="tag">Activo</span>':''}</strong><p>${fmtDate(t.startDate)}${t.endDate?' – '+fmtDate(t.endDate):''} · ${t.categories.length} categorías · ${t.courts||1} pistas</p><p>${esc(t.location||'Sin ubicación')} ${t.notes?'· '+esc(t.notes):''}</p></div><div class="item-actions"><button class="btn small" data-action="activate-tournament" data-id="${t.id}">Abrir</button><button class="btn secondary small" data-action="edit-tournament" data-id="${t.id}">Editar</button><button class="btn danger small" data-action="delete-tournament" data-id="${t.id}">Eliminar</button></div></div>`).join('')}</div>`:empty('No hay torneos creados.','<button class="btn" data-action="new-tournament">Crear torneo</button>'))}
function playersPage(){const q=search.toLowerCase();const ps=state.players.filter(p=>p.name.toLowerCase().includes(q)||(p.club||'').toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q));return pageHead('Parejas inscritas','Asigna cada pareja a su categoría desde el menú desplegable.',`<div class="row"><button class="btn gold" data-action="assign-pair-categories">Asignar categorías</button><button class="btn" data-action="new-player">＋ Añadir pareja</button></div>`)+`<div class="toolbar"><input id="playerSearch" placeholder="Buscar jugador o club…" value="${esc(search)}"><span class="tag">${ps.length} jugadores</span></div>`+(ps.length?`<div class="list">${ps.map(p=>`<div class="item"><div class="item-main"><strong>${esc(p.name)}</strong><p><b>${esc(p.category||'Sin categoría')}</b> · ${esc(p.club||'Sin club')} ${p.phone?'· '+esc(p.phone):''} ${p.email?'· '+esc(p.email):''}</p></div><div class="item-actions"><button class="btn secondary small" data-action="edit-player" data-id="${p.id}">Editar</button><button class="btn danger small" data-action="delete-player" data-id="${p.id}">Eliminar</button></div></div>`).join('')}</div>`:empty(state.players.length?'No hay coincidencias.':'Aún no has registrado jugadores.','<button class="btn" data-action="new-player">Añadir jugador</button>'))}
function tournamentsOptions(){return state.tournaments.map(t=>`<option value="${t.id}" ${t.id===activeT()?.id?'selected':''}>${esc(t.name)}</option>`).join('')}
function categoryOptions(t){return (t?.categories||[]).map(c=>`<option value="${c.id}" ${selectedCategory===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}
function categoryFilter(){const t=activeT();return `<div class="field"><label>Categoría</label><select id="categoryFilter"><option value="all">Todas las categorías</option>${categoryOptions(t)}</select></div>`}

 function unavailable(m,slot){
   const ids=[m.playerA,m.playerB].filter(Boolean);
   return ids.some(id=>{const p=state.players.find(x=>x.id===id);if(!p||!p.availability)return false;const a=p.availability.toLowerCase();
     // Interpret common day/time restrictions; uncertain natural-language rules are flagged for manual review.
     const dayName=new Date(slot.date+'T12:00:00').toLocaleDateString('es-ES',{weekday:'long'}).toLowerCase();
     if(a.includes(dayName)&&(/no disponible|no puede|ocupad|trabaj|incompatible/.test(a)))return true;
     const ranges=[...a.matchAll(/(\d{1,2}):(\d{2})\s*[-a]\s*(\d{1,2}):(\d{2})/g)];
     if(ranges.some(r=>{let x=+r[1]*60+ +r[2],y=+r[3]*60+ +r[4];return slot.mins<y&&slot.mins+90>x}))return true;
     return false;
   });
 }
 function consecutivePenalty(m,slot){
   let penalty=0;
   [m.playerA,m.playerB].filter(Boolean).forEach(id=>{
     const prev=placed.filter(x=>(x.playerA===id||x.playerB===id)&&x.date===slot.date).sort((a,b)=>a.mins-b.mins);
     if(prev.length>=2&&prev.slice(-2).every(x=>x.mins+90===slot.mins))penalty+=1000;
     if(prev.length)penalty+=prev.filter(x=>Math.abs(x.mins-slot.mins)<=90).length*10;
   });return penalty;
 }
 slots.forEach(slot=>{
   if(!pending.length)return;
   let best=-1,bestScore=Infinity;
   pending.forEach((m,i)=>{
     if(unavailable(m,slot))return;
     let score=consecutivePenalty(m,slot);
     [m.playerA,m.playerB].filter(Boolean).forEach(id=>{if(seedSet.has(id))score-=2;if((appearances[id]||0)>0)score+=appearances[id]*0.2});
     score+=Math.random()*0.05;
     if(score<bestScore){best=i;bestScore=score}
   });
   if(best<0)return;
   const m=pending.splice(best,1)[0];Object.assign(m,{date:slot.date,time:slot.time,court:slot.court,duration:90});m.scheduleWarning=bestScore>=1000?'Revisar: posible tercer partido seguido':'';placed.push({...m,mins:slot.mins});[m.playerA,m.playerB].filter(Boolean).forEach(id=>appearances[id]=(appearances[id]||0)+1);
 });
 // If constraints block slots, leave unscheduled rather than silently violating them.
 pending.forEach(m=>{m.date='';m.time='';m.court='';m.duration=90;m.scheduleWarning='Sin hueco compatible: revisar restricciones/horarios';});
}
function buildGroups(ids,seeds=[]){
 const n=ids.length;if(n<3||n===5)throw Error('No es posible formar grupos de 3 o 4 parejas con '+n+' inscritas. Se necesitan 3 o al menos 6.');
 const shuffled=[...ids];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}
 const count=Math.ceil(n/4),sizes=Array(count).fill(Math.floor(n/count));for(let i=0;i<n%count;i++)sizes[i]++;
 const groups=sizes.map((size,i)=>({id:uid(),name:'Grupo '+String.fromCharCode(65+i),playerIds:[],matches:[],capacity:size}));
 const seedList=shuffled.filter(id=>seeds.includes(id)),rest=shuffled.filter(id=>!seeds.includes(id));
 seedList.forEach((id,i)=>{const g=groups.find(x=>x.playerIds.length<x.capacity);if(g)g.playerIds.push(id)});
 rest.forEach(id=>{const g=groups.find(x=>x.playerIds.length<x.capacity);if(g)g.playerIds.push(id)});
 return groups;
}
function generateMatches(){const t=activeT();if(!t){notify('Primero crea un torneo.');return}const options=t.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');if(!options){notify('Crea primero una categoría.');newCategory();return}openModal('Generar competición y calendario',`<div class="stack"><div class="field"><label>Categoría</label><select name="cat">${options}</select></div><div class="field"><label>Modelo de torneo</label><select name="kind"><option value="groups_knockout">Liga por grupos de 3 o 4 parejas + cuadro eliminatorio</option><option value="league">Liga todos contra todos</option><option value="knockout">Cuadro eliminatorio directo</option></select></div><div class="form-grid"><div class="field"><label>Fecha de inicio</label><input name="date" type="date" value="${esc(t.startDate||today())}" required></div><div class="field"><label>Hora inicial diaria</label><input name="time" type="time" value="09:00" required></div></div><div class="notice">Antes de generar horarios, registra las incompatibilidades en la ficha de cada jugador. El sistema intentará evitar tres partidos seguidos del mismo jugador y respetar las incompatibilidades indicadas.</div><div class="notice"><b>Automático:</b> grupos de 3 o 4 parejas, partidos de 90 minutos, reparto entre pistas y programación consecutiva. Para grupos + eliminatoria se clasificarán los 2 primeros de cada grupo.</div></div>`,fd=>{const c=categoryById(t,fd.get('cat'));if(!c)throw Error('Categoría no encontrada.');if(c.matches.length)throw Error('Esta categoría ya tiene partidos. Elimina sus partidos antes de generar otro calendario.');const ids=[...c.playerIds];if(ids.length<2)throw Error('Se necesitan al menos dos parejas.');if(fd.get('kind')==='groups_knockout'&&(ids.length<3||ids.length===5))throw Error('Para grupos de 3 o 4 parejas, esta categoría debe tener 3 o al menos 6 parejas. Ahora tiene '+ids.length+'.');const kind=fd.get('kind'),startDate=fd.get('date')||t.startDate||today(),startTime=fd.get('time')||'09:00';c.format=kind;c.scheduleDate=startDate;c.startTime=startTime;c.groups=[];let generated=[];
 if(kind==='groups_knockout'){c.groups=buildGroups(ids,c.seeds||[]);c.groups.forEach(g=>{for(let i=0;i<g.playerIds.length;i++)for(let j=i+1;j<g.playerIds.length;j++){const m={id:uid(),playerA:g.playerIds[i],playerB:g.playerIds[j],round:g.name,groupId:g.id,groupName:g.name,stage:'groups',scoreA:'',scoreB:'',status:'pending'};g.matches.push(m);generated.push(m)}});if(!generated.length)throw Error('No se han podido crear partidos para los grupos.');}
 else if(kind==='league'){for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)generated.push({id:uid(),playerA:ids[i],playerB:ids[j],round:'Liga',stage:'league',scoreA:'',scoreB:'',status:'pending'});}
 else {const shuffled=[...ids];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}for(let i=0;i<shuffled.length;i+=2){if(shuffled[i+1])generated.push({id:uid(),playerA:shuffled[i],playerB:shuffled[i+1],round:'Primera ronda',stage:'knockout',scoreA:'',scoreB:'',status:'pending'});else generated.push({id:uid(),playerA:shuffled[i],playerB:'',round:'Primera ronda',stage:'knockout',scoreA:'1',scoreB:'0',status:'done'})}}
 scheduleMatches(t,c,generated,startDate,startTime);c.matches.push(...generated);selectedCategory=c.id;save();closeModal();render();notify('Calendario creado: partidos de 90 minutos y pistas asignadas automáticamente.');},'Generar calendario')}
function groupStats(c,g){const stats=g.playerIds.map(id=>({id,name:playerName(id),pj:0,g:0,p:0,f:0,contra:0,pts:0})),by=Object.fromEntries(stats.map(x=>[x.id,x]));(g.matches||[]).filter(matchStatus).forEach(m=>{const a=by[m.playerA],b=by[m.playerB];if(!a||!b)return;a.pj++;b.pj++;a.f+=Number(m.scoreA);a.contra+=Number(m.scoreB);b.f+=Number(m.scoreB);b.contra+=Number(m.scoreA);if(Number(m.scoreA)>Number(m.scoreB)){a.g++;b.p++;a.pts+=2}else if(Number(m.scoreB)>Number(m.scoreA)){b.g++;a.p++;b.pts+=2}});return stats.sort((a,b)=>b.pts-a.pts||b.g-a.g||(b.f-b.contra)-(a.f-a.contra)||a.name.localeCompare(b.name))}
function generateKnockout(catId){const t=activeT(),c=categoryById(t,catId);if(!c||c.format!=='groups_knockout')return;if(c.matches.some(m=>m.stage==='knockout')){notify('El cuadro eliminatorio ya está creado.');return}if(!c.groups?.length){notify('No hay grupos creados.');return}if(c.groups.some(g=>(g.matches||[]).some(m=>!matchStatus(m)))){notify('Completa todos los partidos de todos los grupos antes de crear el cuadro.');return}const qualifiers=c.groups.map(g=>groupStats(c,g).slice(0,2)).flat().map(x=>x.id);if(qualifiers.length<2)throw new Error('Se necesitan al menos dos clasificados.');const shuffled=[...qualifiers];for(let i=shuffled.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]}const label='Cuadro eliminatorio · primera ronda',ms=[];for(let i=0;i<shuffled.length;i+=2){if(shuffled[i+1])ms.push({id:uid(),playerA:shuffled[i],playerB:shuffled[i+1],round:label,stage:'knockout',scoreA:'',scoreB:'',status:'pending'});else ms.push({id:uid(),playerA:shuffled[i],playerB:'',round:label,stage:'knockout',scoreA:'1',scoreB:'0',status:'done'})}scheduleMatches(t,c,ms,c.scheduleDate||t.startDate||today(),c.startTime||'09:00');c.matches.push(...ms);save();render();notify('Cuadro eliminatorio creado con los clasificados.');}
function saveMatch(id,catId){const t=activeT(),c=categoryById(t,catId),m=c?.matches.find(x=>x.id===id);if(!m)return;const els=[...document.querySelectorAll(`[data-id="${id}"][data-cat="${catId}"][data-match-field]`)];els.forEach(el=>m[el.dataset.matchField]=el.value);if(m.scoreA!==''&&m.scoreB!==''&&m.playerB)m.status='done';else m.status='pending';save();render();notify('Partido actualizado.')}
function deleteMatch(id,catId){const c=categoryById(activeT(),catId);if(c&&confirm('¿Eliminar este partido?')){c.matches=c.matches.filter(m=>m.id!==id);save();render();notify('Partido eliminado.')}}

function importBackup(file){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!Array.isArray(d.players)||!Array.isArray(d.tournaments))throw Error('Formato incorrecto: se necesitan las listas de jugadores y torneos.');const tournaments=d.tournaments.map(t=>({...t,categories:Array.isArray(t.categories)?t.categories:[]}));if(!confirm('La importación reemplazará todos los datos actuales. ¿Has guardado una copia de los datos actuales?'))return;state={version:1,players:d.players.map(p=>({...p,category:p.category||'',availability:p.availability||''})),tournaments,activeTournament:d.activeTournament||tournaments[0]?.id||null};save();render();notify('Copia importada correctamente: '+state.players.length+' jugadores y '+state.tournaments.length+' torneos.')}catch(e){notify('No se pudo importar: '+e.message)}};r.readAsText(file)}
function bindMain(){const s=$('#activeTSelect');if(s)s.addEventListener('change',()=>{setActive(s.value);render()});const ps=$('#playerSearch');if(ps)ps.addEventListener('input',e=>{search=e.target.value;const pos=e.target.selectionStart;render();const n=$('#playerSearch');n.focus();n.setSelectionRange(pos,pos)});const cf=$('#categoryFilter');if(cf)cf.addEventListener('change',filterMatches);const sf=$('#matchStatusFilter');if(sf)sf.addEventListener('change',filterMatches);const ms=$('#matchSearch');if(ms)ms.addEventListener('input',filterMatches);const cd=$('#calendarDate');if(cd)cd.addEventListener('change',filterCalendar);const cc=$('#calendarCourt');if(cc)cc.addEventListener('change',filterCalendar)}
