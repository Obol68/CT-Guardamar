plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('CTG_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('CTG_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('CTG_KEY_ALIAS')
def releaseKeyPassword = System.getenv('CTG_KEY_PASSWORD')

android {
    namespace 'es.clubtenisguardamar.gestor'
    compileSdk 35

    defaultConfig {
        applicationId 'es.clubtenisguardamar.gestor'
        minSdk 23
        targetSdk 28
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
        }
    }
}
